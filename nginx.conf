# Processed by the nginx image's entrypoint, which substitutes ${PORT} and
# leaves nginx's own $uri alone - it only replaces names that exist as
# environment variables.

server {
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a returning visitor keeps loading the
    # previous build's asset names after a redeploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
